# Public inventory template. Do not put real host names or addresses here.
#
# Copy this file to inventory.local.ini (gitignored) and replace the
# placeholders with your real inventory aliases. ansible.cfg reads
# inventory.local.ini. Keep each alias in its [primary] or [secondary] group;
# the role vars come from group_vars/<group>.yml.
#
# The primary Mac is normally the control node (connection=local).
# The secondary Mac is reached over LAN SSH. Use its short SSH alias so
# OpenSSH picks up the reserved-IP HostName from the Pass-rendered
# ~/.ssh/config.local. An mDNS-only name fails across a travel router or
# another subnet.

[macos]
primary-mac   ansible_connection=local ansible_host=127.0.0.1
secondary-mac ansible_host=<ssh-alias> ansible_user=<user>

[macos:vars]
# Override if this repo is not the chezmoi sourceDir
# repo_root is derived in the playbook from inventory_dir/..

[primary]
primary-mac

[secondary]
secondary-mac
