# macOS home machines — same pattern as orion/uranus ansible inventories.
# haumea is normally the control node (connection=local).
# moon is reached over LAN SSH (key: id_ed25519_moon or agent).

[macos]
haumea ansible_connection=local ansible_host=127.0.0.1
moon   ansible_host=moon.local ansible_user=axelquack

[macos:vars]
# Override if this repo is not the chezmoi sourceDir
# repo_root is derived in the playbook from inventory_dir/..

[primary]
haumea

[secondary]
moon
